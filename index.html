<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هایپرفوکوس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;background:#090014;user-select:none;overflow-x:hidden}
.sky{position:fixed;inset:0;transition:background .4s ease}
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xp{font-size:clamp(1.35rem,5.5vw,1.85rem);font-weight:900;line-height:1.25}
.xp b{font-size:1.7em;text-shadow:0 0 18px currentColor}
.tag{padding:6px 12px;border-radius:999px;font-weight:900;font-size:.8rem;white-space:nowrap}
.behind{background:#fb7185}.ok{background:#34d399;color:#064e3b}.ahead{background:#fde047;color:#3b0764}
.mood{font-weight:900;font-size:clamp(.95rem,3.8vw,1.15rem);line-height:1.5;min-height:2.8em}
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:#0006;border:2px solid #fff3;border-radius:20px;padding:14px;text-align:center}
.card .k{font-size:.8rem;font-weight:800;opacity:.85}
.card .v{font-size:clamp(1.7rem,8vw,2.7rem);font-weight:900;line-height:1.1;animation:glow 1.2s ease-in-out infinite alternate}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.clockwrap{display:flex;justify-content:center}
.ringsvg{width:120px;height:120px;filter:drop-shadow(0 0 12px #fde04788)}
.icon{font-size:2.4rem;filter:drop-shadow(0 6px 0 #0004)}
h1{font-size:clamp(1.25rem,5vw,1.7rem);text-shadow:0 3px 0 #0005,0 0 24px #fff5}
.sub{font-weight:800;font-size:clamp(.85rem,3.2vw,1rem);line-height:1.55;max-width:26em}
.btns{width:min(480px,100%);display:flex;flex-direction:column;gap:10px}
.btns button{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:clamp(1.15rem,4.6vw,1.4rem);padding:16px;border-radius:22px;min-height:56px}
.b1{background:#fde047;color:#3b0764;box-shadow:0 7px 0 #a16207}
.b2{background:#67e8f9;color:#083344;box-shadow:0 7px 0 #0e7490}
.b3{background:#fb7185;color:#fff;box-shadow:0 7px 0 #9f1239}
.btns button:active{transform:translateY(6px);box-shadow:0 1px 0 #0005}
.foot{text-align:center}
.foot button{border:0;background:#fff2;color:#fde047;font:inherit;font-weight:900;padding:9px 14px;border-radius:999px}
.tiny{text-align:center;font-size:.75rem;font-weight:800;opacity:.9}
.share{font-size:.7rem;font-weight:800;word-break:break-all;color:#fde047;margin-top:4px}
canvas#cf{position:fixed;inset:0;z-index:8;pointer-events:none}
.flash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .16s,transform .16s}
.flash.show{opacity:1;transform:scale(1)}
.flash span{font-size:clamp(1.8rem,8vw,3.2rem);font-weight:900;text-align:center;padding:16px;text-shadow:0 6px 0 #0007,0 0 40px #fff}
.cue{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#4c051088}
.cue.show{display:flex}
.cue b{font-size:clamp(1.7rem,7vw,2.8rem);color:#fde047;text-align:center}

@keyframes glow{from{text-shadow:0 0 8px currentColor}to{text-shadow:0 0 28px currentColor,0 0 48px currentColor}}
@keyframes skyMove{0%{filter:hue-rotate(0deg) saturate(1.2)}50%{filter:hue-rotate(25deg) saturate(1.45)}100%{filter:hue-rotate(0deg) saturate(1.2)}}
.sky{animation:skyMove 6s ease-in-out infinite}
.card{backdrop-filter:blur(8px);box-shadow:0 8px 24px #0005}
.btns button{transition:transform .12s, filter .12s}
.btns button:hover{filter:brightness(1.08)}
h1{animation:glow 1.6s ease-in-out infinite alternate}
.ringsvg{animation:glow 2s ease-in-out infinite alternate}


</style>
</head>
<body>
<div class="sky" id="sky"></div>

<div class="cue" id="cue"><b>وقت امتیاز</b></div>
<div class="wrap">
  <div class="row">
    <div class="xp">هدف ۱۰د <b id="goalTitle" style="color:#fde047">0</b></div>
    <span class="tag ok" id="tag">شروع</span>
  </div>
  <div class="board">
    <div class="card"><div class="k">علی</div><div class="v" id="n" style="color:#67e8f9">0</div></div>
    <div class="card" style="border-color:#fde047;box-shadow:0 0 22px #fde04766"><div class="k" style="color:#fde047">هدف دقیقه</div><div class="v" id="goalBox" style="color:#fde047">0</div></div>
    <div class="card"><div class="k">طاها</div><div class="v" id="aryaN" style="color:#fb7185">0</div></div>
  </div>
  <p class="mood" id="h">ده دقیقه فرصت. امتیاز را بزن. طاها بیکار نمی‌ماند.</p>
  <p class="tiny" id="s"></p>
  <div class="mid">
    <div class="clockwrap">
      <svg viewBox="0 0 120 120" class="ringsvg">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
        <text id="clockN" x="60" y="72" text-anchor="middle" font-size="28" fill="#fff" font-weight="900">01:00</text>
      </svg>
    </div>
    <div class="icon" id="icon">⚔️</div>
    <h1 id="title">حمله کن علی</h1>
    <p class="sub" id="sub">هر دقیقه یکی از سه دکمه. صفرتا ده دقیقه مسابقه است.</p>
    <div class="btns">
      <button class="b1" type="button" data-k="aali" data-d="3">عااالییی بوددد  +۳</button>
      <button class="b2" type="button" data-k="khob" data-d="1">خووب بوود  +۱</button>
      <button class="b3" type="button" data-k="kharab" data-d="-1">خراب شد  −۱</button>
    </div>
  </div>
  <div class="foot"><button type="button" id="copy">لینک ثابت ناظر</button><div class="share" id="shareUrl"></div></div>
  <p class="tiny">شتاب من (۱ تا ۳):
    <input id="paceIn" type="number" min="0.1" max="20" step="0.1" value="1.5" style="width:72px;padding:6px;border:0;border-radius:10px;font-weight:900;text-align:center">
    <span id="goalShow"></span>
  </p>
</div>

function pick(a){return a[(Math.random()*a.length)|0]}
function teh(){
  const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tehran",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit"});
  const p=Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {h:+p.hour,min:+p.minute,sec:+p.second,day:p.year+"-"+p.month+"-"+p.day};
}
function blockId(){const t=teh(); const sl=t.min-(t.min%10); return t.day+"-"+String(t.h).padStart(2,"0")+String(sl).padStart(2,"0");}
function elapsedMin(){const t=teh(); return (t.min%10)+t.sec/60;}
function hashStr(s){let h=2166136261; s=String(s||"t"); for(let i=0;i<s.length;i++) h=Math.imul(h^s.charCodeAt(i),16777619); return h>>>0;}
function mulberry32(a){return function(){let t=(a+=0x6D2B79F5); t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296;};}
function remainSec(){ return Math.max(0, (10-elapsedMin())*60); }
function autoGoal(){ return score + pace * (remainSec()/60); }
function tahaNow(goal, el, block){
  const rng=mulberry32(hashStr("taha|"+block));
  const kind=hashStr(block)%6;
  const t=Math.max(0,Math.min(10,el))/10;
  let shape;
  if(kind===0) shape=0.45+1.1*t;
  else if(kind===1) shape=1.35-0.9*t*t;
  else if(kind===2) shape=0.5+1.1*Math.sin(t*Math.PI);
  else if(kind===3) shape=t<0.4?0.4:t<0.75?1.35:0.95;
  else if(kind===4) shape=0.7+0.7*Math.sin(t*Math.PI*2+rng());
  else shape=1.15-0.6*Math.abs(t-0.5);
  let v=1.07*goal*t*shape;
  if(t>=0.999) v=1.07*goal;
  return Math.max(0,Math.round(v));
}
function loadN(k,d){try{const n=parseInt(localStorage.getItem(k),10);return Number.isFinite(n)?n:d}catch(e){return d}}
function saveN(k,n){try{localStorage.setItem(k,String(n))}catch(e){}}
function loadH(){try{return JSON.parse(localStorage.getItem(KH)||"[]")}catch(e){return []}}
function saveH(h){try{localStorage.setItem(KH,JSON.stringify(h.slice(-80)))}catch(e){}}
function loadF(k,d){try{const n=parseFloat(localStorage.getItem(k));return Number.isFinite(n)?n:d}catch(e){return d}}
let score=loadN(KEY,0), hist=loadH(), pace=loadF(KPACE,1.5), theme=0;
if(!(pace>0)) pace=1.5;
(function(){const b=blockId(), p=localStorage.getItem(KBLK); if(p&&p!==b){score=0;hist=[];saveN(KEY,0);saveH([]);} localStorage.setItem(KBLK,b);})();
function uri(n){return "data:audio/mpeg;base64,"+B64[n]}
let player=null;
function speakBoom(){
  try{if(player)player.pause();player=new Audio(uri("boom.mp3"));player.play().catch(function(){});}catch(e){}
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(880, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, ac.currentTime+0.35);
    g.gain.setValueAtTime(0.4, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.4);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.42);
  }catch(e){}
}
function stateObj(){
  const el=elapsedMin();
  const g=autoGoal();
  const tn=tahaNow(g,el,blockId());
  return {score, history:hist, name:"علی", block:blockId(), t:Date.now(), goal:Math.round(g*10)/10, pace:pace, aryaNow:tn};
}
function paint(){
  const el=elapsedMin();
  const g=autoGoal();
  const tn=tahaNow(g,el,blockId());
  document.getElementById("n").textContent=score;
  document.getElementById("aryaN").textContent=tn;
  const vs=score-tn;
  const tag=document.getElementById("tag");
  tag.className="tag "+(vs>=3?"ahead":vs<=-3?"behind":"ok");
  tag.textContent=vs>=3?"جلوی طاها":vs<=-3?"طاها جلوست":"گردن‌به‌گردن";
  const h=document.getElementById("h");
  if(vs>=3) h.textContent="از طاها جلویی. فشار را نگه دار.";
  else if(vs<=-3) h.textContent="طاها عدد بالاتری دارد. بجنب. دکمه یعنی حمله.";
  else h.textContent="نزدیک هم. این ده دقیقه هنوز برنده‌اش معلوم نیست.";
  document.getElementById("s").textContent="مانده "+Math.max(0,remainSec()).toFixed(0)+" ثانیه · شتاب "+pace;
  const gt=document.getElementById("goalTitle"); if(gt) gt.textContent=Math.round(g);
  const gb=document.getElementById("goalBox"); if(gb) gb.textContent=Math.round(score+pace);
  document.title="هدف "+(Math.round(g*10)/10)+" · هایپرفوکوس";
  const gs=document.getElementById("goalShow"); if(gs) gs.textContent=" → هدف "+Math.round(g);
  const pi=document.getElementById("paceIn"); if(pi && document.activeElement!==pi) pi.value=pace;
}

  pace=n; this.value=n; try{localStorage.setItem(KPACE,String(pace))}catch(e){}

    minuteT0=Date.now(); window._said=false;

let minuteT0=Date.now();
function paintClock(){
  const left=Math.max(0,60-Math.floor((Date.now()-minuteT0)/1000));
  const c=document.getElementById("clockN");
  const ring=document.getElementById("ring");
  if(c) c.textContent="00:"+String(left).padStart(2,"0");
  if(ring) ring.style.strokeDashoffset=String(326.73*(1-left/60));
  if(left<=0 && !window._said){
    window._said=true;
    document.getElementById("cue").classList.add("show");
    speakBoom();
    setTimeout(function(){ document.getElementById("cue").classList.remove("show"); minuteT0=Date.now(); window._said=false; }, 1600);
  }
}

  const url=friendUrl();
  const el=document.getElementById("shareUrl"); if(el) el.textContent=url;
  try{navigator.clipboard.writeText(url)}catch(e){}
  alert("لینک ثابت ناظر:\n"+url);
};
