<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هایپرفوکوس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;background:#090014;user-select:none;overflow-x:hidden}
.sky{position:fixed;inset:0;transition:background .45s ease}
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xp{font-size:clamp(1rem,3.6vw,1.2rem);font-weight:900}
.xp b{color:#fde047;font-size:1.35em;text-shadow:0 0 18px #fde047aa}
.tag{padding:5px 11px;border-radius:999px;font-weight:900;font-size:.78rem;white-space:nowrap}
.behind{background:#fb7185}.ok{background:#34d399;color:#064e3b}.ahead{background:#fde047;color:#3b0764}
.mood{font-weight:900;font-size:clamp(.88rem,3.4vw,1.05rem);line-height:1.45;min-height:2.6em}
.box{background:#0006;border:2px solid #fff3;border-radius:18px;padding:8px}
canvas#chart{width:100%;height:160px;display:block}
.leg{font-size:.72rem;font-weight:800;opacity:.9;margin-top:4px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.clockwrap{display:flex;justify-content:center}
.ringsvg{width:112px;height:112px;filter:drop-shadow(0 0 10px #fde04777)}
.icon{font-size:2.1rem;filter:drop-shadow(0 6px 0 #0004);animation:pop .45s ease}
h1{font-size:clamp(1.15rem,4.6vw,1.55rem);text-shadow:0 3px 0 #0005,0 0 22px #fff4}
.sub{font-weight:800;font-size:clamp(.8rem,3.1vw,.95rem);line-height:1.5;max-width:26em}
.btns{width:min(460px,100%);display:flex;flex-direction:column;gap:9px;margin-top:4px}
.btns button{border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:clamp(1.1rem,4.4vw,1.35rem);padding:14px 14px;border-radius:20px;min-height:52px}
.b1{background:#fde047;color:#3b0764;box-shadow:0 6px 0 #a16207}
.b2{background:#67e8f9;color:#083344;box-shadow:0 6px 0 #0e7490}
.b3{background:#fb7185;color:#fff;box-shadow:0 6px 0 #9f1239}
.btns button:active{transform:translateY(5px);box-shadow:0 1px 0 #0005}
.foot{text-align:center}
.foot button{border:0;background:#fff2;color:#fde047;font:inherit;font-weight:900;font-size:.85rem;padding:8px 12px;border-radius:999px}
.tiny{text-align:center;font-size:.72rem;font-weight:800;opacity:.88}
.share{font-size:.7rem;font-weight:800;word-break:break-all;color:#fde047;margin-top:4px}
canvas#cf{position:fixed;inset:0;z-index:8;pointer-events:none}
.flash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.86);transition:opacity .18s,transform .18s}
.flash.show{opacity:1;transform:scale(1)}
.flash span{font-size:clamp(2rem,9vw,3.4rem);font-weight:900;text-align:center;padding:18px;text-shadow:0 6px 0 #0006,0 0 40px #fff}
.cue{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#4c051080;backdrop-filter:blur(6px)}
.cue.show{display:flex}
.cue b{font-size:clamp(1.6rem,7vw,2.6rem);color:#fde047;text-align:center;animation:shake .2s linear infinite}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{50%{transform:translateX(4px)}}
.shake body,.wrap.hit{animation:shake .18s linear 3}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="cf"></canvas>
<div class="flash" id="flash"><span id="flashT"></span></div>
<div class="cue" id="cue"><b>وقت ثبت امتیاز<br>الان بزن</b></div>
<div class="wrap" id="wrap">
  <div class="row">
    <div class="xp">علی <b id="n">0</b> · طاها <b id="aryaN" style="color:#fb7185">0</b> / <span id="gshow">۴۰</span></div>
    <span class="tag ok" id="tag">رقابت</span>
  </div>
  <p class="mood" id="h">ده دقیقه جنگ. طاها ۷٪ بالای هدف می‌دود. تو باید ردش کنی.</p>
  <p class="tiny" id="s"></p>
  <div class="box">
    <canvas id="chart"></canvas>
    <div class="leg">طلایی هدف ۱۰د · آبی علی · قرمز طاها</div>
  </div>
  <div class="mid">
    <div class="clockwrap">
      <svg viewBox="0 0 120 120" class="ringsvg">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
        <text id="clockN" x="60" y="72" text-anchor="middle" font-size="28" fill="#fff" font-weight="900">01:00</text>
      </svg>
    </div>
    <div class="icon" id="icon">⚔️</div>
    <h1 id="title">نبرد ده دقیقه</h1>
    <p class="sub" id="sub">هر دقیقه که جنگیدی یکی از سه دکمه را بزن. طاها صبر نمی‌کند.</p>
    <div class="btns">
      <button class="b1" type="button" data-k="aali" data-d="3">عااالییی بوددد  +۳</button>
      <button class="b2" type="button" data-k="khob" data-d="1">خووب بوود  +۱</button>
      <button class="b3" type="button" data-k="kharab" data-d="-1">خراب شد  −۱</button>
    </div>
  </div>
  <div class="foot"><button type="button" id="copy">لینک ثابت ناظر</button><div class="share" id="shareUrl"></div></div>
  <p class="tiny">هدف این ده دقیقه:
    <input id="goalIn" type="number" min="1" step="1" value="40" style="width:72px;padding:6px;border:0;border-radius:10px;font-weight:900;text-align:center">
  </p>
</div>
<script src="chart.js"></script>

  "radial-gradient(900px 500px at 90% 90%,#fb7185aa,transparent),linear-gradient(160deg,#9f1239,#4c0519 50%,#0c0a09)"
];
const WIN=["قهرماننن","بارrrrیکلا","ماشاالله","ردش کردی","علی آتشه","تاج مال تو","طاها جا موند","انفجار امتیاز","فوق‌العاده","حمله طلایی"];
const MID=["نزدیکه","فشار بده","نفس نده","همین ریتم","رقابت زنده","گردن‌به‌گردن","یک قدم دیگر","نذار فاصله بیفته"];
const LOSE=["طاها داره می‌ره","عقب افتادی","بجنب علی","جریمه رقابت","دیر شد","پس بگیر","حمله کن","خواب نرو"];
function pick(a){return a[(Math.random()*a.length)|0]}
function loadN(k,d){try{const n=parseInt(localStorage.getItem(k),10);return Number.isFinite(n)?n:d}catch(e){return d}}
function saveN(k,n){try{localStorage.setItem(k,String(n))}catch(e){}}
function loadH(){try{return JSON.parse(localStorage.getItem(KH)||"[]")}catch(e){return []}}
function saveH(h){try{localStorage.setItem(KH,JSON.stringify(h.slice(-80)))}catch(e){}}
function blockId(){ return window.missionMath.blockId(); }
let score=loadN(KEY,0), fail=loadN(KFAIL,0), hist=loadH(), goal=loadN(KGOAL,40), theme=0;
(function(){
  const b=blockId(), p=localStorage.getItem(KBLK);
  if(p&&p!==b){score=0;fail=0;hist=[]; saveN(KEY,0);saveN(KFAIL,0);saveH([]);}
  localStorage.setItem(KBLK,b);
})();
function uri(n){return "data:audio/mpeg;base64,"+B64[n]}
let player=null;
function speakBoom(){
  try{ if(player) player.pause(); player=new Audio(uri("boom.mp3")); player.play().catch(function(){}); }catch(e){}
  boomFx();
}
function boomFx(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(90, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(28, ac.currentTime+0.45);
    g.gain.setValueAtTime(0.55, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.5);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.52);
  }catch(e){}
}
function stateObj(){
  return {score, history:hist, name:"علی", block:blockId(), t:Date.now(), goal:goal,
    arya: window.missionMath.aryaSeries(goal, window.missionMath.elapsedMin(), blockId())};
}
function paint(){
  const nEl=document.getElementById("n"); if(nEl) nEl.textContent=score;
  try{
    const A=window.drawMission(stateObj(), {n:"n",tag:"tag",h:"h",s:"s",chart:"chart"});
    document.getElementById("gshow").textContent=goal;
    var an=document.getElementById("aryaN"); if(an && A) an.textContent=A.aryaNow;
    const gi=document.getElementById("goalIn"); if(gi && document.activeElement!==gi) gi.value=goal;
  }catch(e){}
}
function flash(text, color){
  const f=document.getElementById("flash"), t=document.getElementById("flashT");
  t.textContent=text; t.style.color=color||"#fff";
  f.classList.add("show");
  setTimeout(function(){ f.classList.remove("show"); }, 520);
  document.getElementById("sky").style.background=SKY[theme%SKY.length];
  theme++;
}
const cv=document.getElementById("cf"), ctx=cv.getContext("2d"); let bits=[];
function size(){cv.width=innerWidth;cv.height=innerHeight} size(); addEventListener("resize",size);
function burst(n, cols){
  for(let i=0;i<n;i++) bits.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*22,vy:-4-Math.random()*16,g:.32,s:6+Math.random()*10,c:cols[i%cols.length],life:70});
}
(function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.life>0);
  for(const b of bits){b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.life--;ctx.globalAlpha=Math.max(0,b.life/50);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.s,b.s*0.55);ctx.globalAlpha=1}
  requestAnimationFrame(loop);
})();
document.getElementById("sky").style.background=SKY[0];
paint();
document.getElementById("goalIn").value=goal;
document.getElementById("goalIn").addEventListener("change", function(){
  const g=parseInt(this.value,10);
  if(!Number.isFinite(g)||g<1){ this.value=goal; return; }
  goal=g; saveN(KGOAL,goal); paint(); pushRoom();
});
setInterval(function(){
  const b=blockId(), p=localStorage.getItem(KBLK);
  if(p!==b){score=0;fail=0;hist=[]; saveN(KEY,0);saveN(KFAIL,0);saveH([]); localStorage.setItem(KBLK,b); flash("ده دقیقهٔ تازه","#fde047"); pushRoom();}
  paint();
}, 2000);
document.querySelectorAll(".btns button").forEach(function(btn){
  btn.addEventListener("click", function(){
    const k=btn.getAttribute("data-k"), d=+btn.getAttribute("data-d");
    score+=d; if(score<0) score=0; saveN(KEY,score);
    hist.push({min: window.missionMath.elapsedMin(), score: score}); saveH(hist);
    if(k==="kharab"){fail++; saveN(KFAIL,fail);} else {fail=0; saveN(KFAIL,0);}
    const word = d>=3 ? pick(WIN) : d>0 ? pick(MID) : pick(LOSE);
    document.getElementById("title").textContent=word;
    document.getElementById("sub").textContent = d<0 ? "طاها همین الان امتیاز دزدید. پس بگیر." : "علی حمله کرد. فاصله را ببند.";
    document.getElementById("icon").textContent = d>=3 ? "👑" : d>0 ? "⚡" : "💥";
    flash(word, d<0 ? "#fb7185" : d>=3 ? "#fde047" : "#67e8f9");
    burst(d<0?40:90, d<0?["#fb7185","#fff"]:[ "#fde047","#fff","#67e8f9","#fb7185"]);
    minuteT0=Date.now(); window._said=false;
    paint(); pushRoom();
  });
});
let minuteT0=Date.now();
function paintClock(){
  const left=Math.max(0, 60-Math.floor((Date.now()-minuteT0)/1000));
  const c=document.getElementById("clockN");
  const ring=document.getElementById("ring");
  if(c) c.textContent="00:"+String(left).padStart(2,"0");
  if(ring) ring.style.strokeDashoffset=String(326.73*(1-left/60));
  if(left<=0 && !window._said){
    window._said=true;
    document.getElementById("cue").classList.add("show");
    speakBoom();
    setTimeout(function(){
      document.getElementById("cue").classList.remove("show");
      minuteT0=Date.now(); window._said=false;
    }, 1600);
  }
}
setInterval(paintClock, 80);
function friendUrl(){
  return location.origin+location.pathname.replace(/index\.html.*$/,"/")+"nazer.html";
}
async function pushRoom(){
  try{
    const A=window.missionMath.analyze(score, hist, goal, stateObj().arya);
    const body=Object.assign(stateObj(), {mood:A.mood, rank:A.cls});
    await fetch(NTFY,{method:"POST",headers:{"Content-Type":"application/json","Title":"state"},body:JSON.stringify(body)});
  }catch(e){}
}
document.getElementById("copy").onclick=function(){
  const url=friendUrl();
  const el=document.getElementById("shareUrl"); if(el) el.textContent=url;
  try{navigator.clipboard.writeText(url)}catch(e){}
  alert("لینک ثابت ناظر:\n"+url);
};
pushRoom();
setInterval(pushRoom, 8000);
</script>
</body>
