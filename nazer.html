<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وضعیت مطالعه</title>
<style>
body{margin:0;min-height:100vh;font-family:Tahoma,sans-serif;color:#fff;background:linear-gradient(165deg,#3b0764,#9d174d 50%,#0c0614);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{width:min(420px,100%)}
.xp{font-size:4rem;font-weight:900;color:#fde047}
.bar{height:16px;background:#0005;border-radius:99px;overflow:hidden;margin:16px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#fb7185);width:0}
h1{font-size:1.4rem}
p{font-weight:700;line-height:1.7;opacity:.95}
</style>
</head>
<body>
<div class="box">
  <p>روند مطالعه</p>
  <div class="xp" id="n">—</div>
  <div class="bar"><i id="f"></i></div>
  <h1 id="r">در حال اتصال…</h1>
  <p id="s">دکمه امتیاز ندارد. فقط تماشا.</p>
</div>
<script>
const API="https://jsonblob.com/api/jsonBlob/";
const id=new URLSearchParams(location.search).get("id");
async function pull(){
  if(!id){ document.getElementById("r").textContent="لینک ناقص است"; return; }
  try{
    const st=await (await fetch(API+id,{cache:"no-store"})).json();
    const sc=+st.score||0;
    document.getElementById("n").textContent=sc;
    document.getElementById("f").style.width=Math.min(100,100*sc/360)+"%";
    document.getElementById("r").textContent=st.rank||("هدف ۲۵۰ · پادشاه ۳۶۰");
    document.getElementById("s").textContent="آخرین به‌روز: همین لحظه. بدون دخالت در امتیاز.";
  }catch(e){
    document.getElementById("r").textContent="فعلاً وصل نشد";
  }
}
pull(); setInterval(pull, 3000);
</script>
</body>
</html>
