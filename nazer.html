<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روند علی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(165deg,#2e1065,#9d174d 55%,#0c0614);padding:18px 14px 28px}
h1{font-size:1.25rem;margin-bottom:8px}
.xp{font-size:2.8rem;font-weight:900;color:#fde047}
.tag{display:inline-block;margin:8px 0;padding:7px 12px;border-radius:999px;font-weight:900;font-size:.9rem}
.behind{background:#fb7185}.ok{background:#34d399;color:#064e3b}.ahead{background:#fde047;color:#3b0764}
p{font-weight:700;line-height:1.7;margin:8px 0}
.box{background:#0004;border:2px solid #fff3;border-radius:20px;padding:12px;margin-top:10px}
canvas{width:100%;height:220px;display:block}
.leg{display:flex;gap:12px;font-size:.78rem;font-weight:800;opacity:.9;margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<h1>ماموریت زندهٔ علی</h1>
<div class="xp" id="n">—</div>
<div class="tag ok" id="tag">...</div>
<p id="h">در حال اتصال…</p>
<p id="s"></p>
<div class="box">
  <canvas id="chart"></canvas>
  <div class="leg"><span><i class="dot" style="background:#fde047"></i> تابع هدف</span><span><i class="dot" style="background:#67e8f9"></i> امتیاز علی</span></div>
</div>
<script src="chart.js"></script>
<script>
const API="https://jsonblob.com/api/jsonBlob/";
const id=new URLSearchParams(location.search).get("id");
async function pull(){
  if(!id){ document.getElementById("h").textContent="لینک ناقص است. علی باید از داخل بازی «لینک مشاهده روند علی» را بزند."; return; }
  try{
    const st=await (await fetch(API+id,{cache:"no-store"})).json();
    window.drawMission(st, {n:"n",tag:"tag",h:"h",s:"s",chart:"chart"});
  }catch(e){
    document.getElementById("h").textContent="وصل نشد. رفرش کن. اگر باز نشد علی دوباره لینک بسازد.";
  }
}
pull(); setInterval(pull, 4000);
</script>
</body>
</html>
