<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روند علی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(165deg,#2e1065,#9d174d 55%,#0c0614);padding:18px 14px 28px}
h1{font-size:1.25rem;margin-bottom:8px}
.xp{font-size:2.8rem;font-weight:900;color:#fde047}
.tag{display:inline-block;margin:8px 0;padding:7px 12px;border-radius:999px;font-weight:900;font-size:.9rem}
.behind{background:#fb7185}.ok{background:#34d399;color:#064e3b}.ahead{background:#fde047;color:#3b0764}
p{font-weight:700;line-height:1.7;margin:8px 0}
.box{background:#0004;border:2px solid #fff3;border-radius:20px;padding:12px;margin-top:10px}
canvas{width:100%;height:220px;display:block}
</style>
</head>
<body>
<h1>ماموریت زندهٔ علی</h1>
<div class="xp" id="n">—</div>
<div class="tag ok" id="tag">...</div>
<p id="h">در حال اتصال…</p>
<p id="s"></p>
<div class="box"><canvas id="chart"></canvas></div>
<script src="chart.js"></script>
<script>
const q=new URLSearchParams(location.search);
function apply(st){ window.drawMission(st,{n:"n",tag:"tag",h:"h",s:"s",chart:"chart"}); }
(function(){
  const d=q.get("d");
  if(d){
    try{
      const st=JSON.parse(decodeURIComponent(escape(atob(d))));
      apply(st);
      return;
    }catch(e){
      document.getElementById("h").textContent="داده لینک خراب است. علی دوباره لینک بفرستد.";
    }
  }
  const id=q.get("id");
  if(!id){ document.getElementById("h").textContent="لینک ناقص است."; return; }
  const API="https://jsonstorage.net/api/items/";
  async function pull(){
    try{ apply(await (await fetch(API+id,{cache:"no-store"})).json()); }
    catch(e){ document.getElementById("h").textContent="سرور خارجی بسته است. از علی بخواه لینک جدید (با ?d=) بفرستد."; }
  }
  pull(); setInterval(pull,4000);
})();
</script>
</body>
</html>
