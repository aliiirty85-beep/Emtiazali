<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روند علی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(165deg,#2e1065,#9d174d 55%,#0c0614);padding:18px 14px 28px}
h1{font-size:1.25rem;margin-bottom:8px}
.xp{font-size:clamp(2rem,10vw,2.8rem);font-weight:900;color:#fde047}
.tag{display:inline-block;margin:8px 0;padding:7px 12px;border-radius:999px;font-weight:900;font-size:.9rem}
.behind{background:#fb7185}.ok{background:#34d399;color:#064e3b}.ahead{background:#fde047;color:#3b0764}
p{font-weight:700;line-height:1.7;margin:8px 0}
.box{background:#0004;border:2px solid #fff3;border-radius:20px;padding:12px;margin-top:10px}
canvas{width:100%;height:min(42vh,280px);min-height:180px;display:block}
</style>
</head>
<body>
<h1>ناظر · روند علی و طاها</h1>
<div class="xp" id="n">—</div>
<div class="tag ok" id="tag">...</div>
<p id="h">در حال اتصال به اتاق ثابت…</p>
<p id="s"></p>
<div class="box"><canvas id="chart"></canvas></div>
<p style="opacity:.8;font-size:.85rem">این صفحه لینک ثابت است. هر وقت باز شود آخرین وضعیت می‌آید.</p>
<script src="chart.js"></script>
<script>
const NTFY="https://ntfy.sh/emtiazali-hf-live";
async function pull(){
  try{
    const txt=await (await fetch(NTFY+"/json?poll=1&since=24h",{cache:"no-store"})).text();
    const lines=txt.trim().split("\n").filter(Boolean);
    if(!lines.length){ document.getElementById("h").textContent="هنوز امتیازی از علی نیامده."; return; }
    const last=JSON.parse(lines[lines.length-1]);
    const st=typeof last.message==="string"?JSON.parse(last.message):last.message;
    window.drawMission(st,{n:"n",tag:"tag",h:"h",s:"s",chart:"chart"});
  }catch(e){
    document.getElementById("h").textContent="الان وصل نشد. چند ثانیه بعد دوباره می‌آید.";
  }
}
pull(); setInterval(pull, 4000);
</script>
</body>
</html>
